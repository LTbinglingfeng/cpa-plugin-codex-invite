name: Build

on:
  pull_request:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  PLUGIN_NAME: codex-invite

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: make test

      - name: Vet
        run: make vet

      - name: Race tests
        run: go test -race ./...

      - name: Native ABI smoke test
        run: |
          make build
          python3 .github/scripts/native-smoke.py dist/codex-invite.so

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-24.04
            manylinux_image: quay.io/pypa/manylinux2014_x86_64
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
            manylinux_image: quay.io/pypa/manylinux2014_aarch64
          - goos: darwin
            goarch: amd64
            runner: macos-15-intel
          - goos: darwin
            goarch: arm64
            runner: macos-15
          - goos: windows
            goarch: amd64
            runner: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up MinGW
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            make

      - name: Resolve release metadata
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev"
          fi
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "ARCHIVE_NAME=${PLUGIN_NAME}_${VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}.zip" >> "${GITHUB_ENV}"

      - name: Build and package Linux plugin (GLIBC 2.17)
        if: runner.os == 'Linux'
        env:
          GOARCH: ${{ matrix.goarch }}
          MANYLINUX_IMAGE: ${{ matrix.manylinux_image }}
        run: |
          set -euo pipefail

          # setup-go lives at a host-only path. Copy the complete toolchain,
          # then mount it at a stable, read-only path inside manylinux.
          go_dir="$(mktemp -d "${RUNNER_TEMP}/manylinux-go.XXXXXX")"
          trap 'rm -rf "$go_dir"' EXIT
          cp -a "$(go env GOROOT)/." "$go_dir/"
          chmod -R a+rX "$go_dir"

          # Use the runner UID/GID so artifacts remain writable on the host.
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$PWD:/src" \
            -v "$go_dir:/opt/go:ro" \
            -w /src \
            -e HOME=/tmp \
            -e GOROOT=/opt/go \
            -e GOPATH=/tmp/gopath \
            -e GOCACHE=/tmp/go-build \
            -e GOTOOLCHAIN=local \
            -e GOARCH \
            -e VERSION \
            -e PLUGIN_NAME \
            "$MANYLINUX_IMAGE" \
            bash -euo pipefail -c '
              # Keep the image PATH (compiler/Python); packaging uses Go,
              # so it does not depend on the container default Python version.
              export PATH="/opt/go/bin:${PATH}"
              make package VERSION="${VERSION}" GOOS=linux GOARCH="${GOARCH}"

              library="dist/${PLUGIN_NAME}.so"
              glibc_versions="$(readelf --version-info "$library" | sed -n "s/.*Name: GLIBC_\([0-9.]*\).*/\1/p" | sort -Vu)"
              if [[ -z "$glibc_versions" ]]; then
                echo "No GLIBC version requirements found in $library" >&2
                exit 1
              fi
              printf "GLIBC versions:\n%s\n" "$glibc_versions"
              max_glibc="$(printf "%s\n" "$glibc_versions" | tail -n 1)"
              if [[ "$(printf "2.17\n%s\n" "$max_glibc" | sort -V | tail -n 1)" != "2.17" ]]; then
                printf "linux %s plugin requires GLIBC_%s, expected GLIBC_2.17 or older\n" "$GOARCH" "$max_glibc" >&2
                exit 1
              fi
              /opt/python/cp311-cp311/bin/python3 .github/scripts/native-smoke.py "$library"
            '

      - name: Build and package plugin
        if: runner.os != 'Linux'
        run: make package VERSION="${VERSION}" GOOS="${{ matrix.goos }}" GOARCH="${{ matrix.goarch }}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: |
            dist/${{ env.ARCHIVE_NAME }}
            dist/${{ env.ARCHIVE_NAME }}.sha256
          if-no-files-found: error

  build-windows-arm64:
    name: Build windows/arm64
    needs: test
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve release metadata
        id: release_metadata
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev"
          fi
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "ARCHIVE_NAME=${PLUGIN_NAME}_${VERSION}_windows_arm64.zip" >> "${GITHUB_ENV}"

      - name: Build Windows ARM64 shared library
        timeout-minutes: 45
        uses: go-cross/cgo-actions@v1
        env:
          GOFLAGS: -trimpath -buildmode=c-shared
        with:
          dir: .
          packages: .
          targets: windows-arm64
          out-dir: dist/windows-arm64
          output: ${{ env.PLUGIN_NAME }}.dll
          flags: -ldflags=-s -w
          x-flags: main.pluginVersion=${{ steps.release_metadata.outputs.version }}

      - name: Package plugin
        run: |
          set -euo pipefail
          rm -f go-cross-bin.h "dist/windows-arm64/${PLUGIN_NAME}.h"
          go run ./.github/scripts/package-release.go \
            -library "dist/windows-arm64/${PLUGIN_NAME}.dll" \
            -archive "dist/${ARCHIVE_NAME}" \
            -checksum "dist/${ARCHIVE_NAME}.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: |
            dist/${{ env.ARCHIVE_NAME }}
            dist/${{ env.ARCHIVE_NAME }}.sha256
          if-no-files-found: error

  build-freebsd:
    name: Build freebsd/amd64
    needs: test
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Resolve release metadata
        id: release_metadata
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="0.0.0-dev"
          fi
          echo "VERSION=${VERSION}" >> "${GITHUB_ENV}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "ARCHIVE_NAME=${PLUGIN_NAME}_${VERSION}_freebsd_amd64.zip" >> "${GITHUB_ENV}"

      - name: Install FreeBSD cross-build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang lld wget

      - name: Build FreeBSD shared library
        timeout-minutes: 45
        run: |
          set -euo pipefail
          # FreeBSD 14.3 moved from the release mirror to the official archive.
          # Keep the existing ABI baseline and verify its published MANIFEST hash.
          sysroot="$(mktemp -d "${RUNNER_TEMP}/freebsd-sysroot.XXXXXX")"
          trap 'rm -rf "$sysroot"' EXIT
          curl -fL --retry 3 \
            https://archive.freebsd.org/old-releases/amd64/14.3-RELEASE/base.txz \
            -o "$sysroot/base.txz"
          echo "e38b5cf756d60086a6c2f736eff19cc7685f7e2313e31d14342fc8df57200a92  $sysroot/base.txz" | sha256sum -c -
          tar --no-same-owner -xf "$sysroot/base.txz" -C "$sysroot" ./lib ./usr/lib ./usr/include
          CGO_ENABLED=1 \
          CC="clang --target=x86_64-unknown-freebsd14.3 --sysroot=$sysroot" \
          CGO_LDFLAGS=-fuse-ld=lld \
            make build VERSION="$VERSION" GOOS=freebsd GOARCH=amd64 BUILD_DIR=dist/freebsd-amd64

      - name: Package plugin
        run: |
          set -euo pipefail
          rm -f go-cross-bin.h "dist/freebsd-amd64/${PLUGIN_NAME}.h"
          go run ./.github/scripts/package-release.go \
            -library "dist/freebsd-amd64/${PLUGIN_NAME}.so" \
            -archive "dist/${ARCHIVE_NAME}" \
            -checksum "dist/${ARCHIVE_NAME}.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: |
            dist/${{ env.ARCHIVE_NAME }}
            dist/${{ env.ARCHIVE_NAME }}.sha256
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build
      - build-windows-arm64
      - build-freebsd
    runs-on: ubuntu-24.04
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sort dist/*.sha256 > dist/checksums.txt
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" dist/*.zip dist/checksums.txt --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${GITHUB_REF_NAME}" dist/*.zip dist/checksums.txt \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --title "${GITHUB_REF_NAME}" \
              --notes "Automated release for ${GITHUB_REF_NAME}."
          fi
